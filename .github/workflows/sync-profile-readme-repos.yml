name: Sync profile README repositories

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-profile-readme-repos.yml"
      - "scripts/sync_profile_readme_repos.py"
  schedule:
    # Runs daily at 05:00 UTC.
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync repositories in profile README
        env:
          # Prefer an org-level PAT (read:org + repo read) so private repositories are included.
          # Falls back to the default repository-scoped GitHub token when not configured.
          GITHUB_TOKEN: ${{ secrets.ORG_REPO_READ_TOKEN || github.token }}
          ORG_NAME: FSW-AppTeam
          README_PATH: profile/README.md
        run: python scripts/sync_profile_readme_repos.py

      - name: Commit changes
        env:
          README_PATH: profile/README.md
        run: |
          if git diff --quiet -- "${README_PATH}"; then
            echo "No README changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${README_PATH}"
          git commit -m "chore: sync profile README repositories"
          git push
